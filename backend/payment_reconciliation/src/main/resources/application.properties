# Load from .env file
spring.config.import=optional:file:../../.env[.properties]

spring.application.name=payment_reconciliation

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

management.endpoints.web.exposure.include=health

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Values used in the app
# Set once in the repo-root .env, shared with the nginx proxy and the SPA build.
app.custom.restcontroller.prefix=${APP_API_PREFIX}
app.custom.wide-window.max-days=5
app.custom.tolerance.amount=0.01
app.custom.holidays=\
  2026-01-01,\
  2026-01-19,\
  2026-02-16,\
  2026-05-25,\
  2026-06-19,\
  2026-07-04,\
  2026-09-07,\
  2026-08-12,\
  2026-11-26,\
  2026-12-25