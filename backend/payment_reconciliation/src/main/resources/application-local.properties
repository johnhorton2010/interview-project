# Activated with SPRING_PROFILES_ACTIVE=local for running the app on the host against the
# Compose Postgres. The repo-root .env pins DB_HOST=db, which resolves only on
# pay-recon-net; from the host the same container is reachable on the published port.
# Profile-specific config data outranks the .env that application.properties imports, so
# this wins without editing .env.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}

# Exposed for debugging.
management.endpoints.web.exposure.include=health,env,configprops
#management.endpoint.env.show-values=ALWAYS
