# Load from .env file
spring.config.import=optional:file:../../../../../.env[.properties]

# Enable the H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Database Connection Settings
spring.datasource.url=jdbc:h2:mem:testdbRecEngineTest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Expose actuator endpoints for easier debugging
management.endpoints.web.exposure.include=env,configprops
#management.endpoint.env.show-values=ALWAYS

# Values used in the app
app.custom.restcontroller.prefix=/api/v1
app.custom.wide-window.max-days=5
app.custom.tolerance.amount=0.01
app.custom.holidays=\
  2026-01-01,\
  2026-01-19,\
  2026-02-16,\
  2026-05-25,\
  2026-06-19,\
  2026-07-04,\
  2026-09-07,\
  2026-08-12,\
  2026-11-26,\
  2026-12-25